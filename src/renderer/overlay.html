<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>DOST companion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="overlay-page">
  <main class="companion-card" id="companion-card">
    <div class="slime-wrap" role="img" aria-label="DOST, a friendly green slime">
      <span class="slime-shadow"></span>
      <div class="slime-mount" id="slime-mount" aria-hidden="true"></div>
    </div>
    <div class="companion-copy">
      <div class="companion-heading"><span class="persona-label"><span class="persona-dot"></span> DOST <span class="dot-separator">·</span> CHILL</span><span class="preview-label">PREVIEW</span></div>
      <p class="companion-message">You’ve done good work. A little water break might help your next idea find its way.</p>
      <div class="companion-actions">
        <button id="ok-button" class="okay-button" type="button"><span aria-hidden="true">✓</span> Okay</button>
        <button id="close-button" class="close-button" type="button" aria-label="Close reminder" title="Close reminder">×</button>
      </div>
    </div>
  </main>
  <script src="../shared/personas.js"></script>
  <script src="slime.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
